name: tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            runtime/requirements-data.txt
            runtime/requirements-research.txt
            runtime/requirements-stock-comparison.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install core dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/requirements-stock-comparison.txt
      - name: Install CPU PyTorch for model tests
        run: python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch
      - name: Run public release audit
        shell: pwsh
        run: ./scripts/check_public_release.ps1
      - name: Run unit tests
        working-directory: runtime
        run: python -m unittest discover -s tests -v
      - name: Run recommendation display regression
        run: node runtime/tests/test_result_display.cjs
